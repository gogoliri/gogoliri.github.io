<meta charset="utf-8">
{%- if page.doi_redirect %}
<meta http-equiv="refresh" content="0; url={{ page.doi_redirect }}">
{%- endif %}
{%- assign p = site.data.profile %}
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} — {{ p.name }}{% else %}{{ p.name }}{% endif %}</title>
<meta name="description" content="{{ page.description | default: p.description }}">
<meta name="author" content="{{ p.name }}">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#F5EFE1">
<link rel="canonical" href="{{ page.url | absolute_url }}">
{%- if page.citation %}

<!-- Google Scholar indexing -->
{%- for c in page.citation %}
<meta name="{{ c[0] }}" content="{{ c[1] }}">
{%- endfor %}
{%- endif %}

<meta property="og:type" content="{{ page.og_type | default: 'website' }}">
<meta property="og:title" content="{{ page.og_title | default: page.title | default: p.name }}">
<meta property="og:description" content="{{ page.og_description | default: page.description | default: p.og_description }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
{%- if page.og_image %}
<meta property="og:image" content="{{ page.og_image }}">
{%- endif %}

<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20fill='%23F5EFE1'/%3E%3Cpath%20d='M9%206h3.6v8.4L20.2%206h4.4l-8.2%209.4L25.2%2026h-4.6l-6.4-8.1-1.6%201.8V26H9z'%20fill='%234B6F44'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/assets/css/base.css">
<link rel="stylesheet" href="/assets/css/{{ include.css }}.css">
