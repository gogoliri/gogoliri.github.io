title: Khoa Pham-Dinh
url: https://khoaphamdinh.com
baseurl: ""

# GitHub builds in UTC; posts dated "today" in Helsinki must not count as future.
timezone: Europe/Helsinki

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - scripts
  - tests
  - docs
  - CLAUDE.md
  - README.md
  - node_modules

kramdown:
  auto_ids: false

liquid:
  strict_filters: true

# One file per paper in _papers/; each renders /papers/<file name>.html and its
# homepage entry.
collections:
  papers:
    output: true
    permalink: /papers/:name.html

defaults:
  - scope:
      path: ""
      type: papers
    values:
      layout: paper
      og_type: article
